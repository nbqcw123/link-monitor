<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据字段管理 · 我的资源导航</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1f2329;--sub:#646a73;--line:#e5e6eb;--blue:#3370ff;--red:#d54941;--green:#00a870}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 60px}
header{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:20px}
.head-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:600}
.back{font-size:13px;color:var(--blue);text-decoration:none;border:1px solid var(--blue);border-radius:8px;padding:5px 13px;white-space:nowrap}
.back:hover{background:var(--blue);color:#fff}
.sub{color:var(--sub);font-size:13px;margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 14px;font-weight:600;border-left:4px solid var(--blue);padding-left:10px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head h2{margin:0}
.count{color:var(--sub);font-weight:400;font-size:13px}
.row{display:grid;grid-template-columns:1.2fr 2fr 1fr auto;gap:10px;align-items:end}
@media(max-width:720px){.row{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--sub)}
input,select{font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--blue)}
button{font-family:inherit;font-size:13.5px;cursor:pointer;border-radius:8px;padding:8px 16px;border:1px solid transparent;transition:.15s}
button.primary{background:var(--blue);color:#fff}
button.primary:hover{opacity:.9}
button.ghost{background:#fff;color:var(--sub);border-color:var(--line)}
button.ghost:hover{border-color:var(--blue);color:var(--blue)}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--sub);margin-top:10px;min-height:18px}
.hint.ok{color:var(--green)}
.hint.err{color:var(--red)}
.save-grid{display:grid;grid-template-columns:1.4fr 1.4fr .8fr 1.6fr;gap:10px}
@media(max-width:820px){.save-grid{grid-template-columns:1fr 1fr}}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:1.3fr 2.2fr .9fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;background:#fff}
.item:last-child{border-bottom:0}
.item:hover{background:#fafbfc}
.item .nm{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .u{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .u a{color:var(--sub);text-decoration:none}
.item .u a:hover{color:var(--blue)}
.cat{font-size:11px;padding:1px 8px;border-radius:8px;background:#eef3ff;color:var(--blue);white-space:nowrap}
.new{font-size:10px;padding:1px 6px;border-radius:6px;background:#e8f8f2;color:var(--green)}
.del{background:#fff;color:var(--red);border:1px solid #f7d3d0;padding:4px 10px;font-size:12px}
.del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.empty{padding:26px;text-align:center;color:var(--sub);font-size:13px}
.draft{background:#fff7e6;border:1px solid #ffe0a3;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.draft button{padding:4px 12px;font-size:12.5px}
code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
.search{margin-bottom:10px;max-width:320px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters .search{margin-bottom:0;flex:1 1 240px;max-width:320px}
.filter-cat{flex:0 0 auto;width:auto;min-width:160px;max-width:220px;cursor:pointer}
footer{margin-top:26px;font-size:12px;color:var(--sub);text-align:center}
.lock{position:fixed;inset:0;z-index:100;background:rgba(247,248,250,.97);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.lock.hide{display:none}
.lock-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.lock-card h2{font-size:17px;margin:0 0 4px;border:0;padding:0}
.lock-card .tip{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.lock-card label{margin-bottom:12px}
.lock-card button{width:100%;margin-top:6px;padding:9px}
.lock-msg{font-size:12.5px;color:var(--red);min-height:18px;margin-top:10px}
.wrap{display:none}
body.unlocked .wrap{display:block}
</style>
</head>
<body>
<div class="lock" id="lock">
  <form class="lock-card" id="lockForm" autocomplete="on">
    <h2>管理员登录</h2>
    <div class="tip">此页可修改资源字段，需验证管理员身份</div>
    <label>用户名<input id="l-user" name="username" autocomplete="username" placeholder="管理员账号"></label>
    <label>密码<input id="l-pass" name="password" type="password" autocomplete="current-password" placeholder="管理员密码"></label>
    <button class="primary" type="submit" id="l-btn">进入管理页</button>
    <div class="lock-msg" id="lockMsg"></div>
  </form>
</div>
<div class="wrap">
<header>
  <div class="head-top">
    <h1>数据字段管理</h1>
    <div style="display:flex;gap:8px">
      <button class="back" id="logoutBtn" type="button" style="display:none;background:#fff;cursor:pointer">退出登录</button>
      <a class="back" href="index.html">← 返回导航</a>
    </div>
  </div>
  <div class="sub">只需填名称、地址、类型。保存后写入 <code>resources/resources.json</code>，字段格式与源站结构一致。</div>
</header>

<section class="panel">
  <h2>添加字段</h2>
  <form id="addForm">
    <div class="row">
      <label>名称<input id="f-name" placeholder="例如 某某影视" maxlength="60" required></label>
      <label>地址<input id="f-url" placeholder="https://example.com" required></label>
      <label>类型<select id="f-cat"></select></label>
      <button type="submit" class="primary">添加</button>
    </div>
    <div class="hint" id="formHint"></div>
  </form>
</section>

<section class="panel">
  <div class="draft" id="draftBar">
    <span id="draftText"></span>
    <button class="ghost" id="draftRestore" type="button">恢复草稿</button>
    <button class="ghost" id="draftDiscard" type="button">丢弃</button>
  </div>
  <div class="panel-head">
    <h2>已添加字段 <span class="count" id="count">加载中…</span></h2>
    <button class="ghost" id="reloadBtn" type="button">从仓库重新加载</button>
  </div>
  <div class="filters">
    <input class="search" id="search" placeholder="搜索名称 / 地址">
    <select class="filter-cat" id="filterCat" aria-label="按类型筛选"></select>
  </div>
  <div class="list" id="list"><div class="empty">加载中…</div></div>
</section>

<section class="panel">
  <h2>保存</h2>
  <div class="save-grid" id="credGrid">
    <label>GitHub Token（可选）<input id="s-token" type="password" placeholder="请填写 PAT"></label>
    <label>仓库<input id="s-repo" value="nbqcw123/link-monitor"></label>
    <label>分支<input id="s-branch" value="main"></label>
    <label>文件路径<input id="s-path" value="resources/resources.json"></label>
  </div>
  <div class="actions">
    <button class="primary" id="saveGithub" type="button">保存到仓库</button>
    <button class="ghost" id="saveDownload" type="button">下载 JSON</button>
    <button class="ghost" id="saveCopy" type="button">复制 JSON</button>
  </div>
  <div class="hint" id="saveHint"></div>
</section>

<footer id="footNote">GitHub Actions 方式：保存到仓库会触发自动检测与发布 · Token 仅存本机浏览器</footer>
</div>

<script>
(function(){
  /* ===== 管理员校验 =====
     源码只保存 PBKDF2-SHA256 的盐与派生值，不含明文密码。
     修改密码：本地运行 scripts/set_admin_password.py，把输出的 AUTH 行替换到这里。
     注意：纯静态页面，此校验只拦截普通访问，不能替代服务端鉴权。 */
  var AUTH = {"user":"admin","iter":150000,"salt":"9da889dc3b5be2e29e9e08290aebcb3d","hash":"6V0D8xANEBWS80UMO2tK8NdG3Jf5qQVnrdLC5b3+z20="};
  /* 内置保存凭据（fine-grained token，仅限本仓库 Contents 读写）。留空则需手动填写。 */
  var BUILTIN_TOKEN="";
  var SESSION_KEY="lm_admin_auth_v1";
  /* 服务端模式：由 server.py（NAS 部署）托管时自动启用。
     此时登录与保存都走后端，数据只写 NAS 本地，不推送 GitHub；
     静态模式（GitHub Pages / Actions）才需要 PAT 把更改提交到仓库。 */
  var API="api/";
  var SERVER=false;
  var tries=0, lockUntil=0;

  var CATS=[["online_video","在线影视站"],["open_source","开源项目"],["tvbox_config","TVBox 配置"],["magnet_search","磁力搜索"],["player","播放器"],["music","音乐网站"],["subscription","订阅服务"],["video_app","影视 App"],["cloud_search","网盘搜索"],["subtitles","字幕工具"]];
  var SRC="resources/resources.json";
  var DRAFT="lm_admin_draft_v1";
  var TOKEN_KEY="lm_admin_token_v1";
  var state={data:null,items:[],dirty:false};

  function $(s){return document.querySelector(s)}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  function catName(k){for(var i=0;i<CATS.length;i++){if(CATS[i][0]===k)return CATS[i][1]}return k||"未分类"}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function hint(el,msg,type){el.textContent=msg;el.className="hint"+(type?" "+type:"")}

  function initCats(){
    var sel=$("#f-cat");
    CATS.forEach(function(c){
      var o=document.createElement("option");o.value=c[0];o.textContent=c[1];sel.appendChild(o);
    });
  }

  // 按类型筛选的下拉：只列出实际存在的数据类型，并带数量
  function updateFilterOptions(){
    var sel=$("#filterCat");
    var cur=sel.value;
    var counts={},order=[];
    state.items.forEach(function(it){
      var k=it.category||"other";
      if(counts[k]===undefined){counts[k]=0;order.push(k)}
      counts[k]++;
    });
    sel.innerHTML="";
    var all=document.createElement("option");
    all.value="";all.textContent="全部类型（"+state.items.length+"）";
    sel.appendChild(all);
    order.sort(function(a,b){return counts[b]-counts[a]});
    order.forEach(function(k){
      var o=document.createElement("option");
      o.value=k;o.textContent=catName(k)+"（"+counts[k]+"）";
      sel.appendChild(o);
    });
    if(cur&&counts[cur]!==undefined)sel.value=cur;else sel.value="";
  }

  function makeId(name,url,items){
    var base=String(url||"").replace(/^https?:\/\//,"").split("/")[0].split("?")[0].replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase();
    if(!base)base=String(name||"item").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"item";
    var id=base,i=2,used={};
    items.forEach(function(x){used[x.id]=1});
    while(used[id]){id=base+"-"+i;i++}
    return id;
  }

  function newItem(name,url,cat,items){
    return {
      id:makeId(name,url,items),
      name:name,
      url:url,
      link_url:url,
      category:cat,
      summary:"",
      summary_short:"",
      platforms:["web"],
      tags:[],
      access:{requires_login:false,free_level:"unknown",regions:[]},
      scores:{},
      scores_source:"manual",
      risks:{copyright:"unknown"},
      verification:{status:"unknown",last_checked:"",method:"manual",notes:"手动添加，等待每日自动检测"},
      source:{submitted_by:"admin",added_at:today()},
      featured:false,
      featured_order:0,
      github:{full_name:"",stars:null},
      enabled:true,
      __new:true
    };
  }

  function render(){
    updateFilterOptions();
    var q=($("#search").value||"").trim().toLowerCase();
    var fc=$("#filterCat").value;
    var list=$("#list");
    var items=state.items.filter(function(it){
      if(fc&&(it.category||"other")!==fc)return false;
      if(!q)return true;
      return (it.name||"").toLowerCase().indexOf(q)>=0||(it.url||"").toLowerCase().indexOf(q)>=0||catName(it.category).toLowerCase().indexOf(q)>=0;
    });
    $("#count").textContent=state.items.length+" 项"+((q||fc)?"（筛选 "+items.length+"）":"");
    if(!items.length){list.innerHTML='<div class="empty">'+(state.items.length?"没有匹配的字段":"还没有字段，用上方表单添加")+'</div>';return}
    var html=items.map(function(it,idx){
      var i=state.items.indexOf(it);
      return '<div class="item">'
        +'<div class="nm">'+esc(it.name)+(it.__new?'<span class="new">新增</span>':'')+'</div>'
        +'<div class="u"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.url)+'</a></div>'
        +'<div><span class="cat">'+esc(catName(it.category))+'</span></div>'
        +'<div><button class="del" type="button" data-i="'+i+'">删除</button></div>'
        +'</div>';
    }).join("");
    list.innerHTML=html;
    Array.prototype.forEach.call(list.querySelectorAll(".del"),function(b){
      b.addEventListener("click",function(){
        var i=parseInt(b.getAttribute("data-i"),10);
        var it=state.items[i];
        if(!confirm("确定删除「"+it.name+"」？保存后才会写入文件。"))return;
        state.items.splice(i,1);
        state.dirty=true;
        saveDraft();
        render();
      });
    });
  }

  function saveDraft(){
    try{
      localStorage.setItem(DRAFT,JSON.stringify({savedAt:new Date().toISOString(),items:state.items}));
    }catch(e){}
  }

  function showDraftBar(){
    var raw=localStorage.getItem(DRAFT);
    if(!raw)return;
    try{
      var o=JSON.parse(raw);
      if(!o||!o.items)return;
      var news=o.items.filter(function(x){return x.__new}).length;
      if(!news&&state.data&&o.items.length===state.data.resources.length)return;
      $("#draftText").textContent="检测到本机草稿（"+o.items.length+" 项，其中新增 "+news+" 项，保存于 "+new Date(o.savedAt).toLocaleString()+"）";
      $("#draftBar").style.display="flex";
      window.__draft=o;
    }catch(e){}
  }

  function payload(){
    return {
      version:(state.data&&state.data.version)||1,
      updated_at:today(),
      resources:state.items.map(function(it){
        var c={};for(var k in it){if(k!=="__new")c[k]=it[k]}
        return c;
      })
    };
  }
  function payloadText(){return JSON.stringify(payload(),null,2)+"\n"}

  async function load(){
    var listEl=$("#list");
    try{
      var url=SERVER?(API+"resources?t="+Date.now()):(SRC+"?t="+Date.now());
      var r=await fetch(url,{cache:"no-store",credentials:"same-origin"});
      if(r.status===401){listEl.innerHTML='<div class="empty">登录状态已失效，请刷新页面重新登录。</div>';$("#count").textContent="未登录";return}
      if(!r.ok)throw new Error("HTTP "+r.status);
      var d=await r.json();
      if(!d||!Array.isArray(d.resources))throw new Error("文件结构不正确");
      state.data=d;
      state.items=d.resources.slice();
      state.dirty=false;
      render();
      showDraftBar();
    }catch(e){
      listEl.innerHTML='<div class="empty">读取 <code>resources/resources.json</code> 失败：'+esc(e.message)+'<br>本地直接打开页面时需通过 HTTP 访问（可用 python -m http.server）。</div>';
      $("#count").textContent="读取失败";
    }
  }

  $("#addForm").addEventListener("submit",function(ev){
    ev.preventDefault();
    var name=$("#f-name").value.trim();
    var url=$("#f-url").value.trim();
    var cat=$("#f-cat").value;
    var h=$("#formHint");
    if(!name||!url){hint(h,"名称和地址都要填。","err");return}
    if(!/^https?:\/\/[^\s]+$/i.test(url)){hint(h,"地址要以 http:// 或 https:// 开头。","err");return}
    var dup=state.items.some(function(x){return (x.url||"").toLowerCase()===url.toLowerCase()});
    if(dup){hint(h,"这个地址已经存在了。","err");return}
    var item=newItem(name,url,cat,state.items);
    state.items.unshift(item);
    state.dirty=true;
    saveDraft();
    render();
    $("#f-name").value="";$("#f-url").value="";
    $("#f-name").focus();
    hint(h,"已添加「"+name+"」，记得点下方保存按钮。","ok");
  });

  $("#search").addEventListener("input",render);
  $("#filterCat").addEventListener("change",render);

  $("#reloadBtn").addEventListener("click",function(){
    if(state.dirty&&!confirm("当前改动未保存，重新加载会丢弃，继续？"))return;
    localStorage.removeItem(DRAFT);
    $("#draftBar").style.display="none";
    load();
  });

  $("#draftRestore").addEventListener("click",function(){
    if(!window.__draft)return;
    state.items=window.__draft.items;
    state.dirty=true;
    $("#draftBar").style.display="none";
    render();
    hint($("#formHint"),"已恢复草稿，别忘了保存。","ok");
  });
  $("#draftDiscard").addEventListener("click",function(){
    localStorage.removeItem(DRAFT);
    window.__draft=null;
    $("#draftBar").style.display="none";
  });

  $("#saveDownload").addEventListener("click",function(){
    var blob=new Blob([payloadText()],{type:"application/json;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="resources.json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
    hint($("#saveHint"),"已下载 resources.json，替换到 resources/ 目录即可。","ok");
  });

  $("#saveCopy").addEventListener("click",async function(){
    try{
      await navigator.clipboard.writeText(payloadText());
      hint($("#saveHint"),"JSON 已复制到剪贴板。","ok");
    }catch(e){
      hint($("#saveHint"),"复制失败，请用「下载 JSON」。","err");
    }
  });

  function b64utf8(str){
    var bytes=new TextEncoder().encode(str),bin="";
    for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  $("#saveGithub").addEventListener("click",async function(){
    if(SERVER){
      var h0=$("#saveHint"),b0=this;
      b0.disabled=true;hint(h0,"正在保存到 NAS 本地…");
      try{
        var resp=await fetch(API+"save",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())});
        var jd=await resp.json().catch(function(){return{}});
        if(!resp.ok)throw new Error(jd.error||("HTTP "+resp.status));
        state.items.forEach(function(it){delete it.__new});
        state.dirty=false;localStorage.removeItem(DRAFT);render();
        hint(h0,(jd.message||"已保存")+"（共 "+jd.total+" 项）","ok");
      }catch(e){
        hint(h0,"保存失败："+e.message,"err");
      }finally{
        b0.disabled=false;
      }
      return;
    }
    var typed=$("#s-token").value.trim();
    var token=typed||BUILTIN_TOKEN;
    var repo=$("#s-repo").value.trim();
    var branch=$("#s-branch").value.trim()||"main";
    var path=$("#s-path").value.trim().replace(/^\/+/,"");
    var h=$("#saveHint");
    if(!token){hint(h,"还没有保存凭据：请填写 Token，或在页面里配置内置凭据。","err");return}
    if(!repo||!path){hint(h,"仓库和文件路径都要填。","err");return}
    var btn=this;btn.disabled=true;hint(h,"正在读取远端文件…");
    try{
      if(typed)localStorage.setItem(TOKEN_KEY,typed);
      var api="https://api.github.com/repos/"+repo+"/contents/"+path;
      var headers={Authorization:"Bearer "+token,Accept:"application/vnd.github+json"};
      var got=await fetch(api+"?ref="+encodeURIComponent(branch),{headers:headers,cache:"no-store"});
      var sha=null;
      if(got.ok){sha=(await got.json()).sha}
      else if(got.status!==404){throw new Error("读取远端失败 HTTP "+got.status)}
      hint(h,"正在提交…");
      var body={message:"chore: 管理页更新资源字段（+"+state.items.filter(function(x){return x.__new}).length+" 项）",content:b64utf8(payloadText()),branch:branch};
      if(sha)body.sha=sha;
      var put=await fetch(api,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},headers),body:JSON.stringify(body)});
      if(!put.ok){
        var msg="HTTP "+put.status;
        try{var j=await put.json();if(j&&j.message)msg+=" "+j.message}catch(e){}
        throw new Error(msg);
      }
      state.items.forEach(function(it){delete it.__new});
      state.dirty=false;
      localStorage.removeItem(DRAFT);
      render();
      hint(h,"已提交到 "+repo+"@"+branch+"，Actions 会自动检测并发布。","ok");
    }catch(e){
      hint(h,"保存失败："+e.message+"（若浏览器直连 GitHub 不通，可改用「下载 JSON」后手动上传）","err");
    }finally{
      btn.disabled=false;
    }
  });

  /* ===== 登录与启动 ===== */
  function hexToBytes(hex){
    var a=new Uint8Array(hex.length/2);
    for(var i=0;i<a.length;i++)a[i]=parseInt(hex.substr(i*2,2),16);
    return a;
  }
  function toB64(buf){
    var b=new Uint8Array(buf),s="";
    for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
    return btoa(s);
  }
  async function derive(pw){
    var enc=new TextEncoder();
    var key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
    var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:hexToBytes(AUTH.salt),iterations:AUTH.iter,hash:"SHA-256"},key,256);
    return toB64(bits);
  }
  function timingEq(a,b){
    if(a.length!==b.length)return false;
    var r=0;
    for(var i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);
    return r===0;
  }

  var booted=false;
  function boot(){
    if(booted)return;
    booted=true;
    $("#lock").classList.add("hide");
    document.body.classList.add("unlocked");
    initCats();
    if(SERVER){
      $("#credGrid").style.display="none";
      $("#logoutBtn").style.display="";
      $("#saveGithub").textContent="保存到 NAS";
      $("#footNote").textContent="NAS 服务端模式：数据只保存到本机 · 不推送 GitHub · 管理员口令只存在服务器上";
      hint($("#saveHint"),"服务端模式：改完直接点「保存到 NAS」，无需填写 Token，也不会提交到任何仓库。");
      load();
      return;
    }
    var savedToken=localStorage.getItem(TOKEN_KEY);
    if(savedToken)$("#s-token").value=savedToken;
    if(BUILTIN_TOKEN&&!savedToken){
      $("#s-token").placeholder="已内置保存凭据，留空即可";
      hint($("#saveHint"),"已内置保存凭据，添加后直接点「保存到仓库」即可。");
    }else if(!savedToken){
      $("#s-token").placeholder="未内置：请填写 PAT";
    }
    load();
  }

  function lockMsg(text){
    var el=$("#lockMsg");
    if(el)el.textContent=text||"";
  }

  $("#lockForm").addEventListener("submit",async function(ev){
    ev.preventDefault();
    var u=$("#l-user").value.trim();
    var pw=$("#l-pass").value;
    var btn=$("#l-btn");
    var now=Date.now();
    if(now<lockUntil){
      lockMsg("尝试次数过多，请 "+Math.ceil((lockUntil-now)/1000)+" 秒后再试");
      return;
    }
    if(!u||!pw){lockMsg("请输入用户名和密码");return}
    if(SERVER){
      btn.disabled=true;lockMsg("正在验证…");
      try{
        var resp=await fetch(API+"login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u,password:pw})});
        var jd=await resp.json().catch(function(){return{}});
        if(resp.ok){
          lockMsg("");$("#l-pass").value="";boot();
        }else{
          lockMsg(jd.error||"用户名或密码不正确");
          $("#l-pass").value="";$("#l-pass").focus();
        }
      }catch(e){
        lockMsg("登录失败："+e.message);
      }finally{
        btn.disabled=false;
      }
      return;
    }
    if(!window.crypto||!crypto.subtle){lockMsg("当前环境不支持加密校验，请用 HTTPS 打开本页");return}
    btn.disabled=true;lockMsg("正在验证…");
    try{
      var h=await derive(pw);
      if(u===AUTH.user&&timingEq(h,AUTH.hash)){
        sessionStorage.setItem(SESSION_KEY,"1");
        lockMsg("");
        $("#l-pass").value="";
        boot();
      }else{
        tries++;
        lockMsg("用户名或密码不正确");
        if(tries>=3){lockUntil=Date.now()+5000;tries=0;lockMsg("连续失败，请 5 秒后再试")}
        $("#l-pass").value="";
        $("#l-pass").focus();
      }
    }catch(e){
      lockMsg("校验失败："+e.message);
    }finally{
      btn.disabled=false;
    }
  });

  /* 探测是否由 server.py 托管：是则启用服务端登录与保存 */
  function probeServer(){
    return fetch(API+"session",{credentials:"same-origin",cache:"no-store"})
      .then(function(r){return r.ok?r.json():null})
      .then(function(d){if(d&&d.server){SERVER=true;return !!d.authed}return null})
      .catch(function(){return null});
  }

  $("#logoutBtn").addEventListener("click",async function(){
    try{await fetch(API+"logout",{method:"POST",credentials:"same-origin"})}catch(e){}
    location.reload();
  });

  (async function(){
    var authed=await probeServer();
    if(SERVER){
      var tip=$("#lockForm").querySelector(".tip");
      if(tip)tip.textContent="服务端鉴权 · 口令只保存在服务器上 · 数据只存 NAS 本地";
      $("#footNote").textContent="NAS 服务端模式：数据只保存到本机 · 不推送 GitHub · 管理员口令只存在服务器上";
      if(authed){boot()}else{$("#l-user").focus()}
      return;
    }
    if(sessionStorage.getItem(SESSION_KEY)==="1"){
      boot();
    }else{
      $("#l-user").focus();
    }
  })();
})();
</script>
